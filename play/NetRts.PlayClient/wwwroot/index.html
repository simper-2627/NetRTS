<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>NetRTS – Play</title>
  <base href="/">
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23213440'/%3E%3Crect x='3' y='3' width='5' height='5' fill='%23E69F00'/%3E%3Ccircle cx='11.5' cy='11.5' r='2.5' fill='%2356B4E9'/%3E%3C/svg%3E">
  <script>
    // Colour theme and brand before first paint, exactly as the spectator site does (lore.js reads
    // data-brand when it is first imported). This origin keeps its own copy of both choices.
    try { const t = localStorage.getItem('netrts-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
    let brand = 'snow';
    try { if (localStorage.getItem('netrts-brand') === 'classic') brand = 'classic'; } catch {}
    document.documentElement.dataset.brand = brand;
    if (brand === 'snow') {
      document.title = 'Badger Brawl – Play';
      document.getElementById('favicon').href = 'images/snow-s-blue.png';
    }
  </script>
  <link rel="preload" id="webassembly">
  <link rel="stylesheet" href="css/netrts.css">
  <link rel="stylesheet" href="css/play.css">
  <!-- Filled in at build time: maps _framework/dotnet.js etc. to their fingerprinted names. A published
       app can't start without it. (So the 2D play view has no three.js import map of its own.) -->
  <script type="importmap"></script>
</head>
<body>
  <div id="app">
    <p class="boot">Loading…</p>
  </div>
  <div id="blazor-error-ui" role="alert">
    Something went wrong. <a href="." class="reload">Reload</a>
    <button type="button" class="dismiss" aria-label="Dismiss">×</button>
  </div>
  <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
